<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><title>SHOT-WING-01 editable comparison anchors</title><desc>One Room. Dashed rings are requested anchors; solid crosses are actual art anchors. Coordinates are not gameplay values.</desc><rect width="1280" height="800" fill="#171821"/><g id="regions" fill-opacity=".23" stroke="#829398"><rect x="0" y="0" width="1280" height="190" fill="#4f626e"/><rect x="0" y="150" width="1280" height="255" fill="#ad884d"/><rect x="0" y="370" width="1280" height="310" fill="#7b5544"/></g><g id="architecture" fill="none" stroke="#9a8870" stroke-width="3"><path d="M0 190L350 140 1200 140 1279 320M70 680L430 400 1240 440M70 680L1240 680M430 400L1240 440"/><path d="M680 108V208"/></g><g id="labels" font-family="monospace" font-size="18" fill="#dfcfaa"><text x="20" y="32">SHOT-WING-01 / FIXED DIAGONAL WING CAMERA</text><text x="20" y="64">Fly space y=0..190 / performance y=150..405 / wing y=370..680</text><text x="20" y="95">Dashed circles = requested stencil. Solid crosses = rendered rest anchors.</text></g><g id="navigation" fill="none" stroke="#ad884d" stroke-width="2"><path d="M180 616L420 520 808 528 1112 528"/></g><g id="anchor-chandelier" stroke="#dfcfaa" fill="none"><circle cx="680" cy="218" r="12" stroke-dasharray="3 3"/><path d="M673 220h14M680 213v14" stroke-width="3"/><path d="M680 218L680 220"/><text x="696" y="202" font-family="monospace" font-size="16" fill="#dfcfaa" stroke="none">CHANDELIER</text></g><g id="anchor-performer-feet" stroke="#dfcfaa" fill="none"><circle cx="930" cy="440" r="12" stroke-dasharray="3 3"/><path d="M925 440h14M932 433v14" stroke-width="3"/><path d="M930 440L932 440"/><text x="948" y="422" font-family="monospace" font-size="16" fill="#dfcfaa" stroke="none">PERFORMER FEET</text></g><g id="anchor-view" stroke="#dfcfaa" fill="none"><circle cx="150" cy="560" r="12" stroke-dasharray="3 3"/><path d="M173 616h14M180 609v14" stroke-width="3"/><path d="M150 560L180 616"/><text x="196" y="596" font-family="monospace" font-size="16" fill="#dfcfaa" stroke="none">VIEW</text></g><g id="anchor-desk" stroke="#dfcfaa" fill="none"><circle cx="420" cy="520" r="12" stroke-dasharray="3 3"/><path d="M413 520h14M420 513v14" stroke-width="3"/><path d="M420 520L420 520"/><text x="436" y="502" font-family="monospace" font-size="16" fill="#dfcfaa" stroke="none">DESK</text></g><g id="anchor-rig" stroke="#dfcfaa" fill="none"><circle cx="765" cy="520" r="12" stroke-dasharray="3 3"/><path d="M801 528h14M808 521v14" stroke-width="3"/><path d="M765 520L808 528"/><text x="824" y="510" font-family="monospace" font-size="16" fill="#dfcfaa" stroke="none">RIG</text></g><g id="anchor-hold" stroke="#dfcfaa" fill="none"><circle cx="1100" cy="530" r="12" stroke-dasharray="3 3"/><path d="M1105 528h14M1112 521v14" stroke-width="3"/><path d="M1100 530L1112 528"/><text x="1128" y="510" font-family="monospace" font-size="16" fill="#dfcfaa" stroke="none">HOLD</text></g><g id="anchor-stagehand-feet" stroke="#dfcfaa" fill="none"><circle cx="150" cy="600" r="12" stroke-dasharray="3 3"/><path d="M145 600h14M152 593v14" stroke-width="3"/><path d="M150 600L152 600"/><text x="168" y="634" font-family="monospace" font-size="16" fill="#dfcfaa" stroke="none">STAGEHAND FEET</text></g><g id="camera" fill="none" stroke="#829398" stroke-width="3"><path d="M18 658L60 658 60 692 18 692ZM60 666L180 580M60 683L230 650"/></g><g id="notes" fill="#dfcfaa" font-family="monospace" font-size="17"><text x="20" y="744">VIEW ↔ DESK ↔ RIG ↔ HOLD. One logical Room: wing-and-stage.</text><text x="20" y="770">Top 1280×720 = comparison frame; 80px footer is guide-only. No ticks / hitboxes / physical distance.</text><text x="20" y="793">Common early sway offsets chandelier 8px right; normal and all outcomes share the same camera.</text></g></svg>