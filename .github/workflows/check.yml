name: setup checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # A verified dependency lockfile is a remaining setup gate.
      - run: npm install --no-audit --no-fund
      - run: npm run check
