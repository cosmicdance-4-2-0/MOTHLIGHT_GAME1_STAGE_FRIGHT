name: Temporary lockfile generation (R0)

on:
  push:
    branches:
      - chore/r0-dev-readiness

permissions:
  contents: write

jobs:
  lockfile-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Produce dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Check file was produced
        run: test -s package-lock.json && node -e "const p=require('./package-lock.json'); if(!p.packages || !p.lockfileVersion) process.exit(1)"
      - name: Preserve generated lockfile for Mothlight review
        uses: actions/upload-artifact@v4
        with:
          name: stage-fright-package-lock-r0
          path: package-lock.json
          retention-days: 2
          if-no-files-found: error
      - name: Commit the generated resolution on the dedicated setup branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile change"
            exit 0
          fi
          git commit -m "chore(r0): record npm dependency resolution" -m "Generated-By: GitHub Actions npm install --package-lock-only" -m "Agent-Integrator: Mothlight — The Invisible Stagehand"
          git push origin HEAD:refs/heads/chore/r0-dev-readiness
